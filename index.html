<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Mark Ultimate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="lang-switch" id="lang-switch">
    <button data-lang="zh">中</button>
    <button data-lang="ja">日</button>
    <button data-lang="en">EN</button>
  </div>

  <main class="app">
    <header class="topbar">
      <h1 data-i18n="title">绝妖星乱舞 · 玄乎乎魔法模拟器</h1>
      <p class="sub" data-i18n="subtitle">判断冰(扇形)与雷(斜45°条带)在真/假预兆叠加下的安全区并点击</p>
    </header>

    <div class="layout">
      <section class="stage-wrap">
        <div class="countdown"><div id="countdown-fill" class="countdown-fill"></div></div>
        <canvas id="stage" width="720" height="720" aria-label="arena"></canvas>
        <p id="status" class="status">点击「开始」或场地出题</p>
        <div class="controls">
          <button id="btn-start" class="btn primary">开始</button>
          <button id="btn-restart" class="btn" data-i18n="restart">重置分数</button>
          <a class="btn" href="p4.html" data-i18n="p4Link">进阶：双段机制 →</a>
        </div>
        <div class="hud" id="hud">
          <span><span data-i18n="score">得分</span> <b id="score">0</b></span>
          <span><span data-i18n="best">最佳</span> <b id="best">0</b></span>
        </div>
      </section>

      <aside class="panel">
        <h2 data-i18n="difficulty">难度（解题时间）</h2>
        <div class="seg" id="time-seg">
          <button class="seg-btn" data-time="10"><span data-i18n="diffCasual">休闲</span><small data-i18n="diffCasualSub">10s</small></button>
          <button class="seg-btn" data-time="5"><span data-i18n="diffNormal">普通</span><small data-i18n="diffNormalSub">5s</small></button>
          <button class="seg-btn" data-time="3"><span data-i18n="diffSavage">零式</span><small data-i18n="diffSavageSub">3s</small></button>
          <button class="seg-btn" data-time="extreme"><span data-i18n="diffExtreme">绝境</span><small data-i18n="diffExtremeSub">5s起·递减</small></button>
        </div>

        <h2 data-i18n="display">显示</h2>
        <div class="toggles">
          <button class="toggle-btn" id="set-learn">
            <span data-i18n="learnName">学习模式</span>
            <small data-i18n="learnSub">显示真/假标签</small>
            <span class="toggle-state"></span>
          </button>
        </div>

        <h3 data-i18n="legendTitle">图例</h3>
        <ul class="legend">
          <li><span class="dot ice"></span> <span data-i18n="legend1">冰预兆（扇形/象限，脚底蓝环）</span></li>
          <li><span class="dot thunder"></span> <span data-i18n="legend2">雷预兆（斜45°条带，头顶紫环）</span></li>
          <li><span class="dot true"></span> <span data-i18n="legend3">白球＝真：预兆区危险</span></li>
          <li><span class="dot false"></span> <span data-i18n="legend4">红球带?＝假：预兆区安全（反转）</span></li>
          <li><span class="dot safe"></span> <span data-i18n="legend5">结算时绿色＝真实安全区</span></li>
        </ul>
      </aside>
    </div>
  </main>

  <div id="result-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-label" data-i18n="modalLabel">绝境 · 最终连击</div>
      <div id="result-score" class="modal-score">0</div>
      <div id="result-comment" class="modal-comment"></div>
      <button id="result-close" class="btn primary modal-close" data-i18n="modalClose">关闭</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
